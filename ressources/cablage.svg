<line x1="590" y1="344" x2="660" y2="402" stroke="#e8a13d" stroke-width="1.6" stroke-dasharray="1 0"/>
<circle cx="660" cy="402" r="3.2" fill="#e8a13d"/>
<text x="28" y="470" fill="#e8a13d" font-size="12" text-anchor="start">Jamais de 5 V sur le header. Le relais est alimenté en 12 V, le Pi en 5 V, jamais ensemble.</text>

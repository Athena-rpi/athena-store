<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Câblage — header 40 broches du Raspberry Pi 5">
<rect width="1120" height="520" fill="#0f1115"/>
<text x="28" y="42" fill="#8ab4f8" font-size="19" font-weight="bold">Câblage — header 40 broches du Raspberry Pi 5</text>
